name: Build & Release HireMonkey

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: x64
            label: intel
          - arch: arm64
            label: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build for macOS ${{ matrix.label }}
        run: npm run build-mac-${{ matrix.label }}

      - name: Create DMG
        run: npm run dmg-${{ matrix.label }}

      - name: Upload DMG to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hiremonkey-mac-${{ matrix.label }}
          path: builds/hiremonkey-darwin-${{ matrix.arch }}/*.dmg

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: builds/hiremonkey-darwin-${{ matrix.arch }}/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build for Windows
        run: npm run build-win

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build Windows installer
        run: makensis WindowsInstaller.nsi

      - name: Zip Windows build
        run: Compress-Archive -Path builds\HireMonkey-win32-x64\* -DestinationPath builds\HireMonkey-win32-x64.zip

      - name: Upload ZIP to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hiremonkey-win
          path: builds/HireMonkey-win32-x64.zip

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: builds/HireMonkey-amd64-1.0.0.13.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
